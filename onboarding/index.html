<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>卡米爾夥伴專區</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f3ec;--paper-deep:#efe8dc;--ink:#1f1b16;--ink-soft:#5c544a;
    --vermillion:#c8401f;--vermillion-deep:#a33218;--line:#d8cdbb;
    --mono:'IBM Plex Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Noto Sans TC',sans-serif;background:var(--paper);color:var(--ink);
    line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(200,64,31,.04), transparent 42%),
      repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(31,27,22,.035) 31px, rgba(31,27,22,.035) 32px);
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 22px 80px}

  header{padding:54px 0 24px;border-bottom:3px solid var(--ink)}
  .kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.32em;color:var(--vermillion);text-transform:uppercase;margin-bottom:12px}
  h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.2}
  .lede{margin-top:12px;color:var(--ink-soft);font-size:14.5px}

  /* toggle */
  .bar{display:flex;align-items:center;justify-content:space-between;margin:26px 0 18px;gap:12px;flex-wrap:wrap}
  .bar .label{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:var(--ink-soft)}
  .toggle{display:inline-flex;border:2px solid var(--ink);background:var(--paper)}
  .toggle button{
    appearance:none;border:none;background:transparent;cursor:pointer;
    font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink-soft);
    padding:8px 14px;display:inline-flex;align-items:center;gap:6px;transition:.15s
  }
  .toggle button + button{border-left:2px solid var(--ink)}
  .toggle button.on{background:var(--ink);color:var(--paper)}
  .toggle svg{width:14px;height:14px;display:block}

  /* shared card surface */
  .item{
    display:block;text-decoration:none;color:inherit;background:#fffdf8;
    border:1px solid var(--line);box-shadow:4px 4px 0 rgba(31,27,22,.07);
    transition:transform .12s ease, box-shadow .12s ease;position:relative
  }
  .item:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 rgba(31,27,22,.10)}
  .item:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(31,27,22,.10)}
  .ico{font-size:26px;line-height:1;flex:none}
  .it-title{display:block;font-family:'Noto Serif TC',serif;font-weight:900;font-size:18px}
  .it-desc{display:block;font-size:13.5px;color:var(--ink-soft);margin-top:3px}
  .meta-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-soft);border:1px solid var(--line);padding:2px 7px;display:inline-block;margin-top:8px}
  .arrow{color:var(--vermillion);font-weight:900;font-size:20px;flex:none}

  /* LIST view */
  .entries.list{display:flex;flex-direction:column;gap:10px}
  .entries.list .item{display:flex;align-items:center;gap:16px;padding:16px 18px}
  .entries.list .it-body{flex:1;min-width:0}
  .entries.list .meta-tag{margin-top:6px}

  /* CARD view */
  .entries.card{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .entries.card .item{padding:20px 20px 18px;display:flex;flex-direction:column;min-height:150px}
  .entries.card .ico{margin-bottom:12px}
  .entries.card .arrow{position:absolute;right:16px;bottom:14px}
  .entries.card .it-body{flex:1}

  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-soft);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  footer a{color:var(--vermillion);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">Cameo Partners · Private</div>
    <h1>夥伴專區</h1>
    <p class="lede">歡迎回來。以下是給卡米爾合作夥伴的資源,點開即用。</p>
  </header>

  <div class="bar">
    <span class="label" id="count">—</span>
    <div class="toggle" role="group" aria-label="檢視方式">
      <button id="btn-list" onclick="setView('list')" aria-label="清單檢視">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="4" x2="13" y2="4"/><line x1="3" y1="8" x2="13" y2="8"/><line x1="3" y1="12" x2="13" y2="12"/></svg>
        清單
      </button>
      <button id="btn-card" onclick="setView('card')" aria-label="卡片檢視">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="2.5" width="4.5" height="4.5"/><rect x="9" y="2.5" width="4.5" height="4.5"/><rect x="2.5" y="9" width="4.5" height="4.5"/><rect x="9" y="9" width="4.5" height="4.5"/></svg>
        卡片
      </button>
    </div>
  </div>

  <div id="entries" class="entries list"></div>

  <footer>
    <span>CAMEO PARTNERS · 內部專用</span>
    <span>看不到要找的?向群組反映</span>
  </footer>

</div>

<script>
  // 入口項目：要加新頁，丟一個資料夾 + 在這裡加一筆即可（href 相對於 /onboarding/）
  var ENTRIES = [
    {
      icon: '✅',
      title: '課前作業檢核表',
      desc: '上課前六項準備，逐項打勾、截圖回報',
      meta: '約 35–50 分鐘',
      href: 'checklist/'
    }
    // 之後例如：
    // { icon:'📄', title:'合作合約與 NDA', desc:'簽署與下載', href:'contract/' },
    // { icon:'🛠', title:'工具範本下載',   desc:'常用範本與設定檔', href:'templates/' },
  ];

  var view = 'list';
  try { var saved = localStorage.getItem('ob_view'); if (saved === 'card' || saved === 'list') view = saved; } catch (e) {}

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function render() {
    var box = document.getElementById('entries');
    box.className = 'entries ' + view;
    box.innerHTML = ENTRIES.map(function(e){
      return '<a class="item" href="' + esc(e.href) + '">' +
               '<span class="ico">' + esc(e.icon) + '</span>' +
               '<span class="it-body">' +
                 '<span class="it-title">' + esc(e.title) + '</span>' +
                 '<span class="it-desc">' + esc(e.desc) + '</span>' +
                 (e.meta ? '<span class="meta-tag">' + esc(e.meta) + '</span>' : '') +
               '</span>' +
               '<span class="arrow">→</span>' +
             '</a>';
    }).join('');
    document.getElementById('count').textContent = '共 ' + ENTRIES.length + ' 項';
    document.getElementById('btn-list').classList.toggle('on', view === 'list');
    document.getElementById('btn-card').classList.toggle('on', view === 'card');
  }

  function setView(v) {
    view = v;
    try { localStorage.setItem('ob_view', v); } catch (e) {}
    render();
  }

  render();
</script>
</body>
</html>
